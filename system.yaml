# Dane wejściowe projektu. Z tego pliku lecą tabele i schemat w raporcie.

N: 3 # UZUPEŁNIĆ — numer studenckiej grupy projektowej; od punktu 2 wchodzi do λ i t

# Elementy nieodnawialne. Liczba elementów n wynika z długości tej listy.
elements:
  - { id: 1, name: Zasilacz DC }
  - { id: 2, name: Płyta główna z procesorem }
  - { id: 3, name: Pamięć operacyjna ECC }
  - { id: 4, name: Dysk systemowy A }
  - { id: 5, name: Dysk systemowy B }
  - { id: 6, name: Interfejs Ethernet }
  - { id: 7, name: Modem LTE }
  - { id: 8, name: Układ chłodzenia }

# Schemat funkcjonalny (pkt 1b) — połączenia między elementami.
links:
  - { from: 1, to: 2, label: "12 V" }
  - { from: 1, to: 8, label: "12 V" }
  - { from: 2, to: 3, label: "DDR4" }
  - { from: 2, to: 4, label: "SATA" }
  - { from: 2, to: 5, label: "SATA" }
  - { from: 2, to: 6, label: "PCIe" }
  - { from: 2, to: 7, label: "PCIe" }

# Struktura niezawodnościowa (pkt 1d) — które elementy muszą działać, żeby
# system był zdatny. Elementy w jednym węźle `par` pełnią funkcje alternatywne:
# wystarczy, że jeden z nich jest zdatny.
#   E1 — E2 — E3 — (E4 ∥ E5) — (E6 ∥ E7) — E8
structure:
  ser:
    - el: 1
    - el: 2
    - el: 3
    - par: [{ el: 4 }, { el: 5 }]
    - par: [{ el: 6 }, { el: 7 }]
    - el: 8
